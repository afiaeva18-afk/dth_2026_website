<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML and CSS</title>
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="./assets/marked.js" defer></script>

  </head>
  <body>
    <header>
      <div id="navBar" class="flex defaultPageMargin">
       
        <nav>
          <ul class="flex">
            <!-- to add a page: create pages/my_page.md and add a link with ?page=my_page -->
            <li><a class="navLink" href="./index.html?page=page_one">page one</a></li>
            <li><a class="navLink" href="./index.html?page=page_two">page two</a></li>
            <li><a class="navLink" href="./index.html?page=page_three">page three</a></li>
            </ul>

        </nav>
      </div>
      <div id="pageHero">
        <div id="bannerShadow" class="flex"><h1>Loading...</h1></div>
      </div>
    </header>
    <main class="defaultPageMargin">
      <!-- the text in this section comes from the markdown files in the pages folder -->
      <section id="content">
        <p>Loading...</p>
      </section>
      <p id="charCount" class="lightText"></p>
      <section>
        
      </section>
    </main>
    <footer>
      <div id="footerBody" class="defaultPageMargin flex">
        
      </div>
    </footer>
  </body>
</html>
